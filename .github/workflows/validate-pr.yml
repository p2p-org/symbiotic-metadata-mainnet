name: Validate Pull Request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-pr:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: read
      pull-requests: write

    steps:

      - name: Detect changed files
        uses: yumemi-inc/changed-files@50f2544ad88b4f274eace9689431b7281132304c # v3.2.0
        id: changes

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validate
        uses: symbioticfi/metadata-validation-scripts@a21a6f01a2b6c5fda769e0c7c0b55d79172568f6 # main @ 2026-07-29
        with:
          files: ${{ steps.changes.outputs.files }}
          issue: ${{ github.event.number }}
          token: ${{ secrets.GITHUB_TOKEN }}
          chain-id: 1
          network-registry: "0xc773b1011461e7314cf05f97d95aa8e92c1fd8aa"
          operator-registry: "0xad817a6bc954f678451a71363f04150fdd81af9f"
          vault-registry: "0xaeb6bdd95c502390db8f52c8909f703e9af6a346"
          adapter-registry: "0x0462B857dD6AC1FBc22f84f9f73Dd74AE7721E5B"
